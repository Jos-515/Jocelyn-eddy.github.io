<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Jocelyn Eddy</title>
  <link rel="stylesheet" href="index.css">
  <style>
    .contact-details {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .email-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--ink);
      flex-wrap: wrap;
    }

    .email-link {
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border-grey);
      background-color: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-grey);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
    }

    .copy-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border-grey);
      background-color: rgba(255, 255, 255, 0.85);
    }

    .copy-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px var(--border-grey);
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      fill: var(--ink);
    }

    .social-actions-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    
    .archival-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border: 1px solid var(--border-grey);
      background-color: rgba(255, 255, 255, 0.5);
      color: var(--ink);
      text-decoration: none;
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 3px 3px 0px var(--border-grey);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
    }

    .archival-button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--border-grey);
      background-color: rgba(255, 255, 255, 0.85);
    }

    .archival-button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--border-grey);
    }

    .archival-button svg {
      width: 18px;
      height: 18px;
      fill: var(--ink);
    }

    .status-note {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="layout">

    <nav class="crisp" aria-label="Main">
      <a class="logo" href="index.html">Jocelyn Eddy</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="background.html">Background</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>

    <main class="crisp">
      <span style="font-family: var(--font-sans); font-size: 1rem; color: var(--muted); letter-spacing: 0.05em; display: block; margin-bottom: 8px;">[ 04 // CONTACT ]</span>

      <hr style="border: none; border-bottom: 1px solid var(--border-grey); margin: 16px 0;">
      
      <p class="status-note">Currently open to internship opportunities and technical collaborations.</p>

      <div class="contact-details">

        <div class="email-container">
          <strong>Email:</strong>
          <a class="email-link" id="email-text" href="mailto:Jocelyneddy@icloud.com">Jocelyneddy@icloud.com</a>
          <button class="copy-btn" id="copy-btn" onclick="copyEmail()" aria-label="Copy Email Address">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span id="copy-label">Copy</span>
          </button>
        </div>


        <div class="social-actions-row">
          <a class="archival-button" href="https://www.linkedin.com/in/jocelyn-eddy-63a79432a" target="_blank" rel="noopener" aria-label="LinkedIn Profile">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
            <span>LinkedIn</span>
          </a>  
          
          <a class="archival-button" href="https://github.com/Jos-515" target="_blank" rel="noopener" aria-label="GitHub Profile">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            <span>GitHub</span>

          <a class="archival-button" href="Assets/Documents/cv.pdf" target="_blank" rel="noopener" aria-label="Download Resume">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span>Curriculum Vitae</span>
          </a>
        </div>
      </div>
    </main>

    <footer class="crisp">
      <p>© 2026 Jocelyn Eddy</p>
    </footer>

  </div>

  <script>
    function copyEmail() {
      const email = "Jocelyneddy@icloud.com";
      navigator.clipboard.writeText(email).then(() => {
        const label = document.getElementById('copy-label');
        label.innerText = "Copied!";
        setTimeout(() => {
          label.innerText = "Copy";
        }, 2000);
      });
    }
  </script>
</body>
</html>
